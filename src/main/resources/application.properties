spring.application.name=tec-auditbot-ws
server.port=8085
spring.profiles.active=${PROFILE:local}

ec.com.technoloqie.chatbot.app.url=http://127.0.0.1:3000/


#variables aplicacion
ec.com.technoloqie.auditbot.api.prefix=/api/v1

#messaging - auditoria de conversaciones (US-01)
auditbot.messaging.exchange=auditbot.exchange
auditbot.messaging.routing-key=conversation.audit.requested
auditbot.messaging.queue=conversation.audit.queue
auditbot.messaging.confirm-timeout=5s
auditbot.messaging.max-payload-size=1MB
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.retry.enabled=false

#messaging - consumo de auditoria (US-02)
auditbot.messaging.dead-letter-exchange=auditbot.dlx
auditbot.messaging.dead-letter-queue=conversation.audit.dlq
auditbot.messaging.dead-letter-routing-key=conversation.audit.failed
auditbot.messaging.max-redeliveries=3

spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s

#persistencia (US-02)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

#spring ai - compatibilidad openai / ollama (US-03)
spring.ai.openai.api-key=${OLLAMA_API_KEY:ollama}
spring.ai.openai.chat.base-url=${OLLAMA_BASE_URL:http://localhost:11434/v1}
spring.ai.openai.chat.options.model=${OLLAMA_MODEL:deepseek-v4.1-flash}
spring.ai.openai.chat.options.temperature=0.7
auditbot.ai.openai.timeout-seconds=30
auditbot.ai.gaps.min-confidence=0.60
auditbot.ai.gaps.similarity-threshold=0.70